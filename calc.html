<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>音声計算機（改良版）</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  #result { font-size: 2em; margin: 20px 0; color: #333; }
  #log { background: #eee; padding: 10px; height: 300px; overflow-y: scroll; font-size: 1.2em; white-space: pre-wrap; }
  button { font-size: 1.2em; padding: 10px 20px; margin-right: 10px; cursor: pointer; }
</style>
</head>
<body>

音声計算機（改良版）
<br><br>
<button id="startBtn">録音開始</button>
<button id="stopBtn">停止</button>
<button id="resetBtn">リセット</button>

<div id="result">合計: 0</div>
<div>認識ログ:</div>
<div id="log"></div>

<script>
let total = 0;
const resultDiv = document.getElementById('result');
const logDiv = document.getElementById('log');
let recognition;

if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                let text = event.results[i][0].transcript;
                processText(text);
            }
        }
    };

    recognition.onerror = function(event) {
        console.error('エラー:', event.error);
    };

    document.getElementById('startBtn').onclick = () => recognition.start();
    document.getElementById('stopBtn').onclick = () => recognition.stop();
    document.getElementById('resetBtn').onclick = () => {
        total = 0;
        resultDiv.innerText = '合計: 0';
        logDiv.innerText = '';
    };
} else {
    alert('このブラウザは音声認識に対応していない。Chromeを使ってくれ。');
}

function processText(text) {
    let originalText = text;

    text = text.replace(/[０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });

    text = text.replace(/、|。|と|て|に|たす|プラス/g, ' ');
    text = text.replace(/マイナス|まいなす|引く/g, '-');
    text = text.replace(/-\s+/g, '-');

    let parts = text.split(/\s+/);
    
    parts.forEach(part => {
        let match = part.match(/-?\d+/);
        if (match) {
            let numStr = match[0];
            let num = parseInt(numStr, 10);
            total += num;
            logDiv.innerText = '認識: [' + originalText + '] -> 計算: ' + numStr + ' -> 合計: ' + total + '\n' + logDiv.innerText;
        }
    });
    resultDiv.innerText = '合計: ' + total;
}
</script>
</body>
</html>
