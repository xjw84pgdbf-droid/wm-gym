<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務チェックリスト</title>
<style>
  body {
    font-family: sans-serif;
    background-color: #f4f7f6;
    color: #333;
    padding: 10px;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .header-title {
    text-align: center;
    font-size: 16px;
    margin: 5px 0 10px 0;
    font-weight: bold;
    color: #2c3e50;
  }
  .progress-container {
    background-color: #ddd;
    border-radius: 6px;
    height: 18px;
    margin-bottom: 8px;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background-color: #4caf50;
    width: 0%;
    border-radius: 6px;
    transition: width 0.3s;
  }
  .progress-text {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 0;
    font-size: 12px;
    font-weight: bold;
    line-height: 18px;
    color: #000;
  }
  #message {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: #2980b9;
    height: 20px;
    margin-bottom: 10px;
  }
  #checklist {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: calc(50% - 4px);
    box-sizing: border-box;
    padding: 4px;
    display: flex;
    flex-direction: column;
  }
  .task {
    display: flex;
    align-items: center;
    padding: 6px;
    border-bottom: 1px dashed #eee;
    cursor: pointer;
    font-size: 13px;
    user-select: none;
    transition: all 0.1s;
  }
  .task:last-child {
    border-bottom: none;
  }
  .task:active {
    transform: scale(0.98);
  }
  .task.completed {
    background-color: #e8f5e9;
    color: #2e7d32;
    text-decoration: line-through;
  }
  .check-mark {
    width: 14px;
    height: 14px;
    border: 1px solid #999;
    border-radius: 3px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fff;
  }
  .task.completed .check-mark {
    background-color: #4caf50;
    border-color: #4caf50;
  }
  .task.completed .check-mark::after {
    content: "✓";
    color: white;
    font-size: 10px;
    font-weight: bold;
  }
  .confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    z-index: 9999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="header-title">業務チェックリスト</div>

<div class="progress-container">
  <div class="progress-bar" id="progress-bar"></div>
  <div class="progress-text" id="progress-text">0%</div>
</div>

<div id="message"></div>

<div id="checklist"></div>

<script>
  const tasksData = [
    ["事務所内", "判子"],
    ["転送", "TEL"],
    ["引き出し", "明日の手板", "メール"],
    ["福・西集荷", "LV", "受け渡し簿"],
    ["貴重品", "送りBOX", "判子", "TEL", "カゴ・ラック", "大型", "日報", "冷暖房"],
    ["FAX", "退勤", "鍵"]
  ];

  const checklistContainer = document.getElementById('checklist');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const messageEl = document.getElementById('message');
  let totalTasks = 0;
  let completedTasks = 0;
  let lastMessage = "";

  tasksData.forEach(function(sectionItems) {
    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    
    sectionItems.forEach(function(item) {
      totalTasks++;
      
      const taskEl = document.createElement('div');
      taskEl.className = 'task';
      
      const checkMark = document.createElement('div');
      checkMark.className = 'check-mark';
      
      const textSpan = document.createElement('span');
      textSpan.textContent = item;
      
      taskEl.appendChild(checkMark);
      taskEl.appendChild(textSpan);
      
      taskEl.addEventListener('click', function() {
        toggleTask(taskEl);
      });
      
      sectionEl.appendChild(taskEl);
    });
    
    checklistContainer.appendChild(sectionEl);
  });

  const messages = [
    "順調だ", "いいペースだ", "一つクリア", "着実に進んでいる", "その調子",
    "素晴らしい", "良いリズムだ", "ナイス", "よし、次に行こう", "完璧だ",
    "順調そのものだ", "いい仕事だ", "その意気だ", "サクサク進んでいる", "完了！",
    "一歩前進", "いい動きだ", "集中できている", "着実だ", "よしよし"
  ];

  function toggleTask(taskEl) {
    const isCompleted = taskEl.classList.contains('completed');
    
    if (!isCompleted) {
      taskEl.classList.add('completed');
      completedTasks++;
      showMessage();
    } else {
      taskEl.classList.remove('completed');
      completedTasks--;
      messageEl.textContent = "";
    }
    
    updateProgress();
  }

  function showMessage() {
    if (completedTasks === totalTasks) {
      messageEl.textContent = "全タスク完了。お疲れ様！";
      messageEl.style.color = "#e74c3c";
      triggerConfetti();
      lastMessage = "";
    } else {
      let randomMsg;
      do {
        randomMsg = messages[Math.floor(Math.random() * messages.length)];
      } while (randomMsg === lastMessage);
      
      lastMessage = randomMsg;
      messageEl.textContent = randomMsg;
      messageEl.style.color = "#2980b9";
    }
  }

  function updateProgress() {
    const percentage = Math.round((completedTasks / totalTasks) * 100);
    progressBar.style.width = percentage + '%';
    progressText.textContent = percentage + '%';
  }

  function triggerConfetti() {
    const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'];
    for (let i = 0; i < 100; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.animationDelay = Math.random() * 1.5 + 's';
      document.body.appendChild(confetti);
      
      setTimeout(function() {
        confetti.remove();
      }, 5000);
    }
  }
</script>
</body>
</html>
