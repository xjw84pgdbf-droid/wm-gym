<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メジャーシステム記憶訓練</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background-color: #f9f9f9;
    color: #333;
    padding: 20px;
    margin: 0;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .app-title {
    font-size: 20px;
    margin-bottom: 20px;
  }
  .settings {
    margin-bottom: 20px;
    text-align: left;
    font-size: 16px;
    line-height: 2;
  }
  .question-box {
    font-size: 48px;
    font-weight: normal;
    margin: 30px 0;
    min-height: 70px;
  }
  .answer-box {
    font-size: 20px;
    color: #0056b3;
    margin: 20px 0;
    min-height: 100px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
  }
  button:active {
    background-color: #0056b3;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="app-title">メジャーシステム記憶訓練</div>
  <div class="settings" id="settingsArea">
    <label><input type="radio" name="mode" value="numToWord" checked> 数字から単語</label><br>
    <label><input type="radio" name="mode" value="wordToNum"> 単語から数字</label>
  </div>
  
  <button id="startBtn">スタート</button>
  
  <div id="playArea" class="hidden">
    <div id="questionDisplay" class="question-box"></div>
    <div id="answerDisplay" class="answer-box"></div>
    
    <button id="showAnswerBtn">答えを見る</button>
    <button id="nextBtn" class="hidden">次へ</button>
    <button id="endBtn" style="background-color: #6c757d; margin-top: 30px;">終了して設定へ戻る</button>
  </div>
</div>

<script>
const rawData = `00:sauce（ソース）/sɔːs/
01:suit（スーツ）/suːt/

03:sum（合計）/sʌm/

07:sack（袋）/sæk/
08:safe（金庫）/seɪf/
09:soap（石鹸）/soʊp/
10:dice（サイコロ）/daɪs/
11:toad（ヒキガエル）/toʊd/
12:tin（缶）/tɪn/
13:dome（ドーム）/doʊm/
14:tire（タイヤ）/ˈtaɪər/
15:tail（尻尾）/teɪl/

17:dog（犬）/dɔːɡ/
18:TV（テレビ）/ˌtiːˈviː/
19:tube（チューブ）/tuːb/
20:nose（鼻）/noʊz/
21:net（ネット）/net/
22:neon（ネオン）/ˈniːɑːn/
23:Nemo（ニモ）/ˈniːmoʊ/
24:Nero（ネロ、ローマ皇帝）/ˈniːroʊ/
25:nail（釘、爪）/neɪl/
26:notch（くぼみ）/nɑːtʃ/
27:nuke（核兵器）/nuːk/
28:knife（ナイフ、kは無音）/naɪf/
29:knob（ドアノブ、kは無音）/nɑːb/
30:mouse（ネズミ）/maʊs/
31:mat（マット）/mæt/
32:moon（月）/muːn/
33:mummy（ミイラ）/ˈmʌmi/
34:mower（芝刈り機）/ˈmoʊər/
35:mole（モグラ）/moʊl/
36:match（マッチ）/mætʃ/
37:mug（マグカップ）/mʌɡ/
38:muff（マフ）/mʌf/

40:rose（バラ）/roʊz/
41:rat（ネズミ）/ræt/
42:rain（雨）/reɪn/
43:ram（雄羊）/ræm/
44:rear（後部）/rɪər/
45:rail（レール）/reɪl/
46:rush（突進）/rʌʃ/
47:rock（岩）/rɑːk/
48:roof（屋根）/ruːf/
49:rope（ロープ）/roʊp/
50:lace（レース）/leɪs/
51:lid（蓋）/lɪd/
52:lion（ライオン）/ˈlaɪən/
53:lime（ライム）/laɪm/
54:lure（ルアー）/lʊər/

56:leech（ヒル）/liːtʃ/

86:fish（魚）/fɪʃ/
87:fog（霧）/fɑːɡ/

89:vape（電子タバコ）/veɪp/
90:bus（バス）/bʌs/
91:bat（コウモリ）/bæt/
92:bone（骨）/boʊn/
93:bomb（爆弾、最後のbは無音）/bɑːm/
94:bear（熊）/beər/
95:pill（薬）/pɪl/
96:peach（桃）/piːtʃ/
97:pig（豚）/pɪɡ/
98:beef（牛肉）/biːf/
99:baby（赤ちゃん）/ˈbeɪbi/`;

const dataList = rawData.trim().split('\n').map(line => {
  const match = line.match(/^(\d{2}):(.*?)（(.*?)）(.*)$/);
  if(match) {
    return {
      num: match[1],
      word: match[2].trim(),
      jp: match[3],
      ipa: match[4].trim()
    };
  }
  return null;
}).filter(item => item !== null);

let currentMode = '';
let currentQuestion = null;

const settingsArea = document.getElementById('settingsArea');
const startBtn = document.getElementById('startBtn');
const playArea = document.getElementById('playArea');
const questionDisplay = document.getElementById('questionDisplay');
const answerDisplay = document.getElementById('answerDisplay');
const showAnswerBtn = document.getElementById('showAnswerBtn');
const nextBtn = document.getElementById('nextBtn');
const endBtn = document.getElementById('endBtn');

function getRandomItem() {
  const randomIndex = Math.floor(Math.random() * dataList.length);
  return dataList[randomIndex];
}

function showNextQuestion() {
  currentQuestion = getRandomItem();
  answerDisplay.textContent = '';
  showAnswerBtn.classList.remove('hidden');
  nextBtn.classList.add('hidden');
  
  if (currentMode === 'numToWord') {
    questionDisplay.textContent = currentQuestion.num;
  } else {
    questionDisplay.textContent = currentQuestion.word;
  }
}

startBtn.addEventListener('click', () => {
  const modeRadios = document.getElementsByName('mode');
  for (let radio of modeRadios) {
    if (radio.checked) {
      currentMode = radio.value;
      break;
    }
  }
  
  settingsArea.classList.add('hidden');
  startBtn.classList.add('hidden');
  playArea.classList.remove('hidden');
  
  showNextQuestion();
});

showAnswerBtn.addEventListener('click', () => {
  const ansText = currentQuestion.num + " : " + currentQuestion.word + "\n（" + currentQuestion.jp + "）\n" + currentQuestion.ipa;
  answerDisplay.textContent = ansText;
  showAnswerBtn.classList.add('hidden');
  nextBtn.classList.remove('hidden');
});

nextBtn.addEventListener('click', showNextQuestion);

endBtn.addEventListener('click', () => {
  playArea.classList.add('hidden');
  settingsArea.classList.remove('hidden');
  startBtn.classList.remove('hidden');
});
</script>
</body>
</html>
